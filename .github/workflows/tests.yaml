name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Review
        run: pnpm turbo run lint ts test:unit architecture:check build
        env:
          VITE_DIRECTUS_URL: http://localhost:8055
          VITE_FRONTEND_URL: http://localhost:5173

      - name: Native tooling tests
        run: pnpm test:native-tooling
